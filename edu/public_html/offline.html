<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3b1fd1">
<title>اتصال برقرار نیست | سامانه آموزش آراد برندینگ</title>
<link rel="icon" href="assets/img/icons/icon-32.png" type="image/png">
<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#1e1b4b;--muted:#6b7280;--p:#4f46e5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1024;--card:#181a36;--text:#eef0ff;--muted:#a3a8c7}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;padding:16px}
.card{background:var(--card);border-radius:22px;padding:32px 24px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(30,27,75,.08)}
img{width:96px;height:96px;border-radius:22px}
h1{font-size:1.2rem;margin:18px 0 8px}
p{color:var(--muted);line-height:1.9;margin:0 0 20px}
a{display:inline-block;background:linear-gradient(135deg,#4f46e5,#9333ea);color:#fff;text-decoration:none;padding:10px 22px;border-radius:12px}
</style>
</head>
<body>
<div class="card">
    <img src="assets/img/icons/icon-192.png" alt="">
    <h1>اتصال به اینترنت برقرار نیست</h1>
    <p>برای دیدن دوره‌ها و ادامه یادگیری به اینترنت نیاز است. پس از اتصال دوباره تلاش کنید.</p>
    <a href="./">تلاش دوباره</a>
</div>
</body>
</html>
