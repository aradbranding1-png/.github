; Supervisor config for سامانه توسعه تجارت queue workers.
; Copy to /etc/supervisor/conf.d/sadt.conf, fix USER and the path, then:
;   supervisorctl reread && supervisorctl update
; After enabling this, remove the "* * * * * ... queue:work" cron line (keep cron.php every 15 minutes).
; Restart after every code update:  supervisorctl restart sadt-worker:*

[program:sadt-worker]
process_name=%(program_name)s_%(process_num)02d
; --instance gives each process its own lock file; jobs are shared safely (SKIP LOCKED).
; --max-time=3600: each worker restarts itself hourly (fresh memory, picks up new code).
command=/usr/local/bin/php /home/USER/domains/aradbranding.app/bin/console queue:work --max-time=3600 --memory=192 --instance=%(process_num)d
numprocs=4
numprocs_start=1
directory=/home/USER/domains/aradbranding.app
user=USER
autostart=true
autorestart=true
startsecs=1
stopsignal=TERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/USER/domains/aradbranding.app/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
